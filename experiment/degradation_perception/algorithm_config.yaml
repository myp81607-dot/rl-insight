# Shared algorithm policy. Changes are loaded when a command or monitor starts.
# Re-run fit after changing alpha, ratios, KDE, or stable-segment settings.
abnormal_type: UP
alpha: 0.01
upper_ratio: 1.15
lower_ratio: 1.15

kde:
  bandwidth: auto
  peak_prominence_ratio: 0.01

stable_segment:
  std_factor: 2.0
  minimum_passed_flags: 4

abnormal_interval:
  minimum_duration: 0.5
  minimum_abnormal_points: 5
  minimum_abnormal_rate: 0.60
  max_normal_points_between: 1

history_policy:
  n_keep_result: 1
  n_keep_abnormal: 1

association:
  enabled: false
  target_metrics:
    - timing_s/step
  weights:
    correlation: 0.5
    random_forest: 0.5
  top_k: 5
  context_ratio: 1.0
  min_aligned_points: 10
  min_rf_samples: 30
  min_coverage_ratio: 0.6
