# Copy this file outside the repository and replace every placeholder.
# This monitor queries the existing Prometheus HTTP API; it opens no port.
baseline_model: ./models/prometheus_baseline_model.json
policy_config: ./algorithm_config.yaml

prometheus:
  url: http://127.0.0.1:9090
  # Use the same run labels in every query. A query returning multiple series
  # is rejected unless PromQL explicitly aggregates them.
  global_step_query: 'rl_insight_monitor_training_global_step{project="<project>", experiment_name="<experiment>"}'
  # This is the PromQL evaluation/sample grid, not the three-minute poll period.
  query_step_seconds: 15
  # Must be long enough to include global steps 5 through 25 on first startup.
  lookback_seconds: 86400
  overlap_seconds: 30
  alignment_tolerance_seconds: 8
  timeout_seconds: 30
  verify_tls: true
  # Keep credentials out of YAML. Uncomment one authentication mode if needed.
  # bearer_token_env: RL_INSIGHT_PROMETHEUS_TOKEN
  # username_env: RL_INSIGHT_PROMETHEUS_USERNAME
  # password_env: RL_INSIGHT_PROMETHEUS_PASSWORD

# Names on the left are the canonical names used by the existing algorithm.
# role:auto applies target_selection. Per-metric abnormal_type overrides the
# shared value in algorithm_config.yaml without changing fitted KDE parameters.
metrics:
  timing_s/step:
    promql: 'rl_insight_monitor_timing_s_step{project="<project>", experiment_name="<experiment>"}'
    role: auto
    abnormal_type: UP
  actor/entropy:
    promql: 'rl_insight_monitor_actor_entropy{project="<project>", experiment_name="<experiment>"}'
    role: auto
    abnormal_type: BOTH

target_selection:
  case_sensitive: false
  patterns:
    - time
    - timing
  unmatched_role: candidate
  # Explicit values may be target, candidate, or ignore.
  overrides: {}

baseline:
  auto_fit: true
  start_step: 5
  end_step: 25
  minimum_samples_per_metric: 10
  minimum_step_coverage_ratio: 0.5
  # baseline_id: degradation-production-v1

poll_interval_seconds: 180
inference_window_points: 100
state_file: ./prometheus_output/monitor_state.json
output_dir: ./prometheus_output
task_id: degradation-prometheus-demo
