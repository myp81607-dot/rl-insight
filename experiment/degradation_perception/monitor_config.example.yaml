# Copy this file outside the repository and replace only the placeholders.
# The same fitted baseline_model.json can be shared by detect and monitor.
baseline_model: ./models/baseline_model.json
policy_config: ./algorithm_config.yaml

remote:
  host: "<remote-host>"
  port: 22
  username: "<username>"
  log_path: /path/to/verl-step-metrics.log
  # key_filename: /path/to/read-only-private-key
  # known_hosts: /path/to/known_hosts
  # password_env: RL_INSIGHT_MONITOR_SSH_PASSWORD
  connect_timeout_seconds: 10
  read_timeout_seconds: 30

metrics:
  - timing_s/step
  - actor/entropy

poll_interval_seconds: 300
inference_window_steps: 100
state_file: ./monitor_output/monitor_state.json
output_dir: ./monitor_output
task_id: degradation-demo
